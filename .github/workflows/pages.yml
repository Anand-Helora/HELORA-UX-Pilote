name: Déploiement GitHub Pages

# Publie le site construit (assets nommés avec hash de contenu, voir
# scripts/construire.mjs) après chaque fusion humaine sur main : exception
# autorisée par la personne propriétaire pour CE dépôt pilote (AGENTS.md).
# Jamais pour une pull request ni une autre branche. Prérequis unique :
# Settings > Pages > Build and deployment > Source = « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Tests et construction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Installer Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Construire le site (assets hachés)
        run: npm run construire

      - name: Publier l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deployer:
    name: Déploiement
    needs: construire
    # Lancement manuel compris : uniquement depuis main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
